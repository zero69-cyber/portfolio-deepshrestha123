<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Structure</title>
</head>
<body>

    <!-- Marquee Section -->
    <div class="marquee-container">
        <marquee behavior="scroll" direction="left" scrollamount="8">
            Welcome to my awesome portfolio! 😎 Keep scrolling for epic content!
        </marquee>
    </div>

    <!-- Header Section -->
    <header>
        <img src="images/WhatsApp Image 2025-11-14 at 09.00.55_819ec6dc.jpg" 
             alt="6'3 nonchalant king but a loser" 
             class="profile-img">

        <h1>My Portfolio</h1>
        <p>Welcome to my website!</p>
    </header>

    <!-- Navigation Section -->
    <nav>
        <ul>
            <li><a href="#about">About</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- About Section -->
    <section id="about">
        <h2>About</h2>
        <p>6'3 nonchalant king who hates महिनावारी.</p>
    </section>

    <!-- Projects Section -->
    <section id="projects">
        <h2>Projects</h2>
        <p>I haven’t done much in my life but I love feet.</p>
    </section>

    <!-- Contact Section -->
    <section id="contact">
        <h2>Contact</h2>

        <form action="#" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" required></textarea>

            <button type="submit">Submit</button>
        </form>

    </section>

</body>
</html>
